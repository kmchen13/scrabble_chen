name: scrabble_P2P
description: "An open source scrabble game with peer-to-peer connectivity, built using Flutter. The game allows players to connect directly to each other without the need for a central server, providing a seamless and interactive gaming experience. Players can enjoy classic scrabble gameplay while leveraging the power of Flutter for a smooth and responsive user interface."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.5 
  cupertino_icons: ^1.0.8
  network_info_plus: ^5.0.3
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.3.0
  http: ^1.2.0
  logger: ^2.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.1.0
  diacritic: ^0.1.3 
  path_provider: ^2.0.15
  share_plus: ^7.2.1
  url_launcher: ^6.2.5

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo/app_logo.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/notify.wav
    - assets/dictionary.txt